[project]
name = "authsome-mcp-proxy"
dynamic = ["version"]
description = "A Model Context Protocol (MCP) proxy that adds an OAuth/OIDC frontend to upstream MCPs that don't include any such — either because they only validate tokens or expect static credentials such as API keys. Bridges to a configurable IdP (Keycloak, AWS Cognito, Google, Azure, generic OIDC) for Claude Desktop, Claude Code, Cursor, Codex, Claude.ai."
readme = "README.md"
authors = [
    { name = "Stephan Eberle", email = "stephaneberle9@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    # 3.4.3 is the first release whose OAuthProxy advertises "none" (and
    # private_key_jwt) in token_endpoint_auth_methods_supported once CIMD is on.
    # That floor is load-bearing rather than cosmetic: Claude picks CIMD only when
    # the authorization-server metadata carries both
    # client_id_metadata_document_supported: true and "none" -- its CIMD client
    # authenticates as a public client -- and silently falls back to DCR when
    # either is missing. Below 3.4.3 the proxy therefore advertises CIMD that no
    # Claude client will ever select. The value is still hardcoded without "none"
    # a layer down, in the MCP SDK's build_metadata() (python-sdk#2260, fix
    # unmerged in #2261); fastmcp patches over it, so the floor belongs here.
    # Capped below 4: fastmcp 4 requires mcp 2.x and moves its HTTP stack from
    # httpx to the httpx2 distribution, which the outbound auth classes here are
    # not written against -- they are httpx.Auth subclasses handed to a fastmcp
    # Client. Lift once this package is ported to httpx2 and the mcp 2.x API.
    "fastmcp>=3.4.3,<4",
    "py-key-value-aio[disk]>=0.3.0",
    # Both arrive transitively via fastmcp, but web mode imports them directly --
    # starlette for the ASGI types the host router is written against, uvicorn to
    # serve the router itself. Declared so a future fastmcp that stops depending on
    # them fails at resolution rather than at import. The floors match what the
    # existing chain already guarantees (fastmcp -> uvicorn>=0.35,
    # fastmcp -> mcp -> starlette>=0.27), so neither narrows resolution; the APIs
    # used (starlette.types, starlette.middleware.Middleware, uvicorn.Config /
    # Server) long predate both.
    "starlette>=0.27",
    "uvicorn>=0.35",
    # Likewise transitive-but-imported-directly. Floors match what the chain
    # already enforces (fastmcp -> httpx>=0.28.1, exceptiongroup>=1.2.2,
    # mcp>=1.24.0, pydantic>=2.11.7; mcp -> anyio>=4.9), so none of these
    # narrows resolution. Upper bounds are omitted where fastmcp already caps
    # the dependency (httpx), since duplicating a cap would only get in the way
    # when it lifts its own.
    #
    # mcp is the exception: delegating its cap to fastmcp only holds while
    # fastmcp itself is capped, and it was not -- so an unlocked install
    # resolved fastmcp 4, hence mcp 2, and mcp 2 renamed McpError to MCPError.
    # __main__ imports the 1.x spelling at module level, so every entry point
    # died with an ImportError before it could speak MCP. Capped here as well as
    # on fastmcp so the constraint names the symbol that actually broke.
    "anyio>=4.9",
    "exceptiongroup>=1.2.2",
    "httpx>=0.28.1",
    "mcp>=1.24.0,<2",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "ty",
    "deptry>=0.20",
    "pre-commit>=4.3.0",
    "ruff",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
    "inline-snapshot>=0.6.0",
]

[project.scripts]
authsome-mcp-proxy = "authsome_mcp_proxy.__main__:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
sources = ["src"]
exclude = [
  "scripts/",
  "*.log"
]

[tool.hatch.build.targets.sdist]  
sources = ["src"]
exclude = [
  "scripts/",
  "*.log"
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.deptry]
# These are regexes, not globs. "*.log" is an invalid regex ("repetition
# operator missing expression") and made deptry panic before scanning
# anything, which is why the tool was configured but never actually ran.
exclude = [
  '.*\.log',
  # Anchored at ^, so a bare '\.venv' would miss the nested venvs under
  # examples/ and leave deptry scanning thousands of site-packages files.
  '.*\.venv',
  # Standalone sample projects, each with its own pyproject and dependencies;
  # judging them against this one's is meaningless.
  'examples',
  'scripts',
]

[tool.deptry.package_module_name_map]
# py-key-value-aio installs as `key_value`, which deptry cannot infer from the
# distribution name.
py-key-value-aio = ["key_value"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001", "RUF013"]
# allow imports not at the top of the file
"src/authsome_mcp_proxy/__init__.py" = ["E402"]

[tool.codespell]
skip = "*.lock,pyproject.toml,*PythonImportHelper*"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=authsome_mcp_proxy",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
